name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: npm ci
      - name: Tests des calculs d'argent
        run: npm test
      - name: Syntaxe PHP de l'API
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Construction du site
        # Google Fonts est téléchargé pendant la construction : une panne réseau passagère ne doit pas faire échouer tout le contrôle
        run: |
          for essai in 1 2 3; do
            npm run build && exit 0
            echo "Construction ratée (essai $essai sur 3), nouvelle tentative…"; sleep 10
          done
          exit 1
      - name: Contrôle du référencement (titres, descriptions, plan du site…)
        run: npm run seo
      - name: Traductions (anglais)
        run: npm run i18n
