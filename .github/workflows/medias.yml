name: Captures et vidéos

# Refait les captures d'écran et/ou les vidéos de démonstration du site, sans passer par un PC.
# Lancement : onglet Actions → « Captures et vidéos » → Run workflow → choisir ce qu'il faut refaire.
# Le résultat est envoyé sur la branche « medias-auto » (et disponible en téléchargement dans la page du lancement) :
# regardez les images et les vidéos, puis ouvrez une pull request de « medias-auto » vers « main » (ou demandez-le à Claude).
on:
  workflow_dispatch:
    inputs:
      quoi:
        description: Ce qu'il faut refaire
        type: choice
        options: [captures, videos, captures et videos]
        default: captures

permissions:
  contents: write

jobs:
  medias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Construction du site
        run: npm run build
      - name: Captures d'écran
        if: ${{ inputs.quoi != 'videos' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run captures
      - name: Voix des vidéos (edge-tts)
        if: ${{ inputs.quoi != 'captures' }}
        run: pip install edge-tts
      - name: Vidéos de démonstration (environ 15 minutes)
        if: ${{ inputs.quoi != 'captures' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run videos
      - name: Archive téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: medias
          path: |
            public/captures
            public/videos
      - name: Envoi sur la branche medias-auto
        run: |
          git config user.name "Kaislo"
          git config user.email "publication@kaislo.com"
          git checkout -B medias-auto
          git add public/captures public/videos
          if git diff --cached --quiet; then
            echo "Rien n'a changé."
          else
            git commit -m "Captures et vidéos refaites (${{ inputs.quoi }})"
            git push --force origin medias-auto
          fi
