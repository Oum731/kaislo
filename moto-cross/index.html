<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111111" />
<meta name="description" content="Course de moto-cross 3D : 3 pistes, 4 motos, figures, nitro, améliorations. Jouable gratuitement dans le navigateur." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ff9d2e'/><text x='32' y='46' font-size='38' text-anchor='middle'>🏍️</text></svg>" />
<title>Moto Cross Racing</title>
<!-- SDK CrazyGames v3 : chargé avant le code du jeu. Hors CrazyGames/localhost il est inactif (le jeu l'ignore). -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #hud .tl{position:absolute;top:12px;left:16px;font-size:22px;font-weight:700;text-shadow:0 2px 4px #000;line-height:1.4}
  #hud .tr{position:absolute;top:12px;right:16px;font-size:22px;font-weight:700;text-shadow:0 2px 4px #000;text-align:right}
  #hud .tc{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:800;color:#ffd84d;text-shadow:0 2px 4px #000}
  #hud .bl{position:absolute;bottom:16px;left:16px;width:200px}
  #bar{height:14px;background:#0008;border:2px solid #fff;border-radius:8px;overflow:hidden}
  #nitro{height:100%;width:100%;background:linear-gradient(90deg,#0af,#5ff)}
  #speed{position:absolute;bottom:16px;right:16px;font-size:40px;font-weight:800;text-shadow:0 2px 4px #000}
  #speed small{font-size:16px}
  #big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;text-shadow:0 4px 12px #000;pointer-events:none}
  #trick{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:44px;font-weight:900;color:#ffe14d;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .25s}
  #trick.crash{color:#ff5a4d}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#2a3a1faa,#000d);text-align:center;gap:8px;overflow-y:auto;justify-content:safe center;padding:54px 12px 10px;box-sizing:border-box}
  #end{background:radial-gradient(#000a,#000e)}
  .screen h1{font-size:clamp(34px,8vw,80px);margin:0;letter-spacing:2px;color:#ff9d2e;text-shadow:0 4px 0 #6a2d00}
  .screen h2{margin:0;font-size:30px}
  .screen p{margin:4px;opacity:.9}
  button{pointer-events:auto;font-family:inherit;font-size:22px;font-weight:800;padding:12px 36px;border:0;border-radius:12px;background:#ff9d2e;color:#222;cursor:pointer}
  button:hover:not(:disabled){background:#ffb95e}
  button:disabled{background:#666;color:#bbb;cursor:not-allowed}
  button.alt{background:#e4e4e4}
  .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .sel{display:flex;align-items:center;gap:12px;margin:2px 0}
  .sel .lab{width:92px;text-align:right;opacity:.75;font-size:14px;text-transform:uppercase;letter-spacing:1px}
  .sel .val{min-width:230px;font-size:22px;font-weight:800}
  .arr{font-size:20px;padding:6px 16px;border-radius:8px}
  .stats{display:grid;grid-template-columns:auto 150px;gap:2px 10px;font-size:13px;text-align:left;margin:4px 0 8px}
  .stats i{display:block;height:8px;border-radius:4px;background:#ff9d2e;margin-top:5px}
  .wallet{position:fixed;top:10px;right:14px;font-size:22px;font-weight:800;color:#ffd84d;text-shadow:0 2px 4px #000;z-index:5}
  .iconbtn{position:fixed;top:8px;left:12px;z-index:5;display:flex;gap:8px}
  .iconbtn button{font-size:20px;padding:6px 12px;background:#0007;color:#fff;border:2px solid #fff6}
  .lock{color:#ff7a6b}
  select{font:inherit;font-weight:700;font-size:16px;background:#0007;color:#fff;border:2px solid #fff6;border-radius:10px;padding:5px 8px;pointer-events:auto}
  select option{color:#111}
  .lvl{display:flex;align-items:center;gap:10px;font-weight:800;margin:0 0 4px}
  .xpbar{width:170px;height:10px;border-radius:6px;background:#0008;border:2px solid #fff7;overflow:hidden}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9d2e,#ffd84d)}
  .objs{font-size:14px;line-height:1.5;margin:2px 0 4px;text-align:left;background:#0005;border-radius:10px;padding:6px 14px}
  .objs b{color:#ffd84d}
  .goal{font-size:13px;opacity:.95;margin:4px 0 2px}
  .goal .xpbar{width:220px;margin:4px auto 0}
  .small{font-size:16px;padding:8px 18px}
  .stars{color:#ffd84d;letter-spacing:2px;margin-left:8px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;width:min(440px,92vw);font-size:18px;font-weight:700}
  .achvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;width:min(900px,96vw);text-align:left}
  .achvgrid div{background:#0007;border:2px solid #fff3;border-radius:12px;padding:8px 12px;font-size:14px}
  .achvgrid div.on{border-color:#ffd84d;background:#3a2c0a99}
  .achvgrid b{display:block;font-size:16px}
  table.st{border-collapse:collapse;margin:6px auto;font-size:16px}
  table.st td{padding:2px 12px}
  table.st tr.me{color:#ffd84d;font-weight:800}
  #banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(34px,7vw,72px);font-weight:900;color:#fff;text-shadow:0 4px 14px #000;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
  #banner.on{opacity:1;transform:scale(1)}
  #rankpop{position:fixed;left:16px;top:84px;font-size:22px;font-weight:900;color:#7dff3a;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s}
  #hint{position:fixed;left:0;right:0;bottom:90px;text-align:center;font-size:18px;font-weight:700;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .4s}
  #nitrofx{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px rgba(70,200,255,.55);opacity:0;transition:opacity .25s}
  #nitrofx.on{opacity:1}
  .lbtable{border-collapse:collapse;margin:4px auto;font-size:16px;min-width:min(420px,90vw)}
  .lbtable td,.lbtable th{padding:3px 12px;text-align:left}
  .lbtable th{opacity:.6;font-weight:600;font-size:13px}
  .lbtable td:last-child,.lbtable th:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .lbtable tr.me{color:#ffd84d;font-weight:800}
  .lbtable tr.medal td:first-child{font-weight:800}
  .daily-box{background:#0005;border:2px solid #ffd84d66;border-radius:12px;padding:8px 16px;font-size:15px;line-height:1.55;max-width:min(560px,94vw)}
  .daily-box b{color:#ffd84d}
  input.txt{font:inherit;font-size:18px;font-weight:700;background:#000a;color:#fff;border:2px solid #fff6;border-radius:10px;padding:8px 12px;width:min(220px,60vw);text-align:center;pointer-events:auto;user-select:text;-webkit-user-select:text}
  #nameBox{display:none;margin:6px 0}
  /* ----- accueil visuel ----- */
  #menu.home{padding:0;gap:0;justify-content:flex-end;align-items:center;overflow:hidden;background:linear-gradient(180deg,#0007 0,#0000 22%,#0000 52%,#000c 100%)}
  .homeLogo{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:clamp(24px,4.6vw,50px);font-weight:900;color:#ff9d2e;text-shadow:0 3px 0 #6a2d00,0 6px 16px #000;letter-spacing:2px;white-space:nowrap}
  .lvlRing{position:absolute;top:46px;right:14px;width:46px;height:46px}
  .lvlRing svg{width:100%;height:100%;transform:rotate(-90deg)}
  .lvlRing circle{fill:#0009;stroke-width:4}
  .lvlRing .bg{stroke:#fff3}
  .lvlRing .fg{fill:none;stroke:#ffd84d;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .6s}
  .lvlRing b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;text-shadow:0 1px 3px #000}
  .chips{display:flex;gap:10px;margin-bottom:12px;align-items:stretch}
  .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 12px;min-width:92px;background:#000b;color:#fff;border:2px solid #fff4;border-radius:16px;font-size:12px;font-weight:700}
  .chip:hover:not(:disabled){background:#222c;border-color:#ff9d2e}
  .chip small{font-size:12px;font-weight:700;opacity:.9;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .ico{font-size:28px;line-height:34px}
  .chip .thumb{width:34px;height:34px;border-radius:50%;border:2px solid #fff;position:relative;overflow:hidden;display:block}
  .chip .thumb i{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-style:normal;font-size:16px;background:#000a}
  .chip .stars{color:#ffd84d;font-size:11px;letter-spacing:1px;min-height:12px}
  .chip .dots{display:flex;gap:5px;height:34px;align-items:center}
  .chip .dots i{width:12px;height:12px;border-radius:50%;background:#fff3}
  .chip .swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;display:block;margin:2px 0}
  .bigplay{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:10px 56px;font-size:clamp(24px,4vw,40px);border-radius:60px;box-shadow:0 6px 0 #a35a00,0 12px 26px #000a;animation:pulse 1.8s ease-in-out infinite}
  .bigplay:disabled{animation:none;box-shadow:none}
  .bigplay .tri{font-size:.8em}
  @keyframes pulse{50%{transform:scale(1.045)}}
  .dock{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
  .dockbtn{width:46px;height:46px;padding:0;border-radius:50%;font-size:20px;background:#000b;color:#fff;border:2px solid #fff5;display:flex;align-items:center;justify-content:center}
  .dockbtn:hover:not(:disabled){background:#222c;border-color:#ff9d2e}
  #infoCard{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);text-align:left;z-index:3}
  .keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .key{min-width:40px;height:40px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:#eee;color:#222;border-radius:8px;border-bottom:4px solid #999;font-weight:900;font-size:18px}
  .key.wide{min-width:72px}
  #garageScreen{align-items:flex-end;justify-content:safe center;padding-right:clamp(10px,5vw,60px);background:linear-gradient(90deg,#0000 38%,#000c 100%)}
  #garageScreen > *{max-width:min(440px,92vw)}
  @media (max-aspect-ratio:1/1){#garageScreen{align-items:center;padding-right:12px;background:linear-gradient(#0000,#000c 55%);justify-content:flex-end}}
  #loading{position:fixed;inset:0;z-index:50;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:28px;font-weight:900;color:#ff9d2e;letter-spacing:2px}
  #loading .spin{width:46px;height:46px;border:6px solid #ff9d2e33;border-top-color:#ff9d2e;border-radius:50%;animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ghostTag{position:absolute;top:70px;right:16px;font-size:16px;font-weight:700;opacity:.85}
  .upg{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;text-align:left;margin:6px 0}
  .pips{letter-spacing:3px;color:#ff9d2e}
  .toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#000c;border:2px solid #ffd84d;color:#ffd84d;padding:10px 20px;border-radius:12px;font-weight:800;z-index:9;display:none}
  .earn{font-size:18px;line-height:1.6;margin:6px 0}
  .earn b{color:#ffd84d}
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  #touch div{position:absolute;bottom:40px;width:84px;height:84px;border-radius:50%;background:#fff3;border:3px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:30px;pointer-events:auto}
  @media (pointer:coarse){
    #speed{right:auto;left:50%;transform:translateX(-50%);bottom:6px;font-size:30px}
    #hud .bl{left:50%;transform:translateX(-50%);bottom:50px;width:170px}
    #touch div{width:68px;height:68px;bottom:18px;font-size:26px}
    #tL{left:14px!important}#tR{left:96px!important}#tB{right:96px!important}#tG{right:14px!important}#tD{right:14px!important;bottom:100px!important}
    #hud .tl,#hud .tr,#hud .tc{font-size:17px;top:6px}
  }
  @media (max-height:620px){
    .screen{padding-top:48px}
    .screen h1{font-size:30px}.screen{gap:3px}.sel .val{font-size:17px;min-width:170px}.arr{padding:4px 12px}
    .stats{grid-template-columns:auto 100px;margin:0 0 3px;font-size:11px}.stats i{margin-top:3px}
    .help{display:none}button{padding:7px 24px;font-size:18px}#big{font-size:70px}.wallet{font-size:17px}
    .earn{font-size:14px;line-height:1.35}.screen h2{font-size:22px}
    .objs{font-size:12px;padding:3px 10px}.goal{font-size:11px}.lvl{font-size:13px}#hint{bottom:70px;font-size:14px}table.st{font-size:13px}.achvgrid div{font-size:12px;padding:4px 8px}.achvgrid b{font-size:13px}.setrow{font-size:15px}
    .small{font-size:14px;padding:5px 12px}
    .homeLogo{top:4px;font-size:24px}.chips{gap:6px;margin-bottom:6px}.chip{min-width:70px;padding:3px 7px}.chip .ico{font-size:21px;line-height:26px}.chip .thumb{width:26px;height:26px}.chip .dots{height:26px}.chip .swatch{width:22px;height:22px}.chip small{font-size:10px;max-width:84px}.bigplay{padding:5px 38px;font-size:22px;margin-bottom:8px}.dockbtn{width:38px;height:38px;font-size:17px}.dock{gap:5px;right:8px;bottom:8px}.lvlRing{width:38px;height:38px;top:40px}#infoCard{bottom:130px}
    .daily-box{font-size:12px;padding:4px 10px;line-height:1.4}.lbtable{font-size:13px}.lbtable td,.lbtable th{padding:1px 10px}input.txt{font-size:15px;padding:5px 8px}
  }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div>MOTO CROSS</div></div>
<div class="wallet" id="wallet" style="display:none"></div>
<div class="iconbtn"><select id="langSel" aria-label="Language"></select><button id="bMusic" title="Music (N)">🎵</button><button id="bSfx" title="Sound (M)">🔊</button></div>
<div class="toast" id="toast"></div>
<div id="hud">
  <div class="tl"><span id="pos"></span><br><span id="lap"></span></div>
  <div class="tc">🪙 <span id="coins">0</span></div>
  <div class="tr"><span id="time"></span><br><span id="best"></span></div>
  <div class="bl"><div data-i18n="hud.nitro">NITRO</div><div id="bar"><div id="nitro"></div></div></div>
  <div id="speed"></div>
  <div id="ghostTag"></div>
</div>
<div id="nitrofx"></div>
<div id="banner"></div>
<div id="rankpop"></div>
<div id="hint"></div>
<div id="big"></div>
<div id="trick"></div>
<div id="touch">
  <div id="tL" style="left:20px">◀</div><div id="tR" style="left:120px">▶</div>
  <div id="tB" style="right:120px">N</div><div id="tG" style="right:20px">▲</div><div id="tD" style="right:20px;bottom:140px">▼</div>
</div>

<div id="menu" class="screen home">
  <div class="homeLogo">MOTO CROSS</div>
  <div class="lvlRing" id="lvlRing"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" id="ringFg" cx="22" cy="22" r="19"/></svg><b id="lvlNum">1</b></div>
  <div id="infoCard" class="daily-box" style="display:none"></div>
  <div class="chips">
    <button class="chip" id="chipMode"><span class="ico" id="chipModeIco"></span><small id="chipModeTxt"></small></button>
    <button class="chip" id="chipTrack"><span class="thumb" id="chipThumb"><i id="chipLock">🔒</i></span><small id="chipTrackTxt"></small><span class="stars" id="chipStars"></span></button>
    <button class="chip" id="chipDiff"><span class="dots" id="chipDots"><i></i><i></i><i></i></span><small id="chipDiffTxt"></small></button>
    <button class="chip" id="chipBike"><span class="swatch" id="chipSwatch"></span><small id="chipBikeTxt"></small></button>
  </div>
  <button id="play" class="bigplay"><span class="tri">▶</span><span id="playLbl">PLAY</span></button>
  <div class="dock">
    <button class="dockbtn" id="bSignIn" style="display:none">👤</button>
    <button class="dockbtn" id="bLb" style="display:none">🏅</button>
    <button class="dockbtn" id="garage">🔧</button>
    <button class="dockbtn" id="bAchv">🏆</button>
    <button class="dockbtn" id="bInfo">ℹ</button>
    <button class="dockbtn" id="bHelp">?</button>
    <button class="dockbtn" id="bSet">⚙</button>
  </div>
  <!-- anciens contrôles : gardés cachés, le code s'en sert pour changer de mode / piste / niveau -->
  <div id="legacy" style="display:none">
    <button id="modeP"></button><button id="modeN"></button><span id="modeName"></span>
    <button id="trkP"></button><button id="trkN"></button><span id="trkLab"></span><span id="trkName"></span>
    <button id="difP"></button><button id="difN"></button><span id="difName"></span>
    <span id="bkName"></span><div id="objs"></div><div id="goal"></div>
    <span id="lvlTxt"></span><i id="xpFill"></i><small id="xpTxt"></small>
  </div>
</div>

<div id="helpScreen" class="screen" style="display:none">
  <h2 data-i18n="help.title">Controls</h2>
  <div class="keys"><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span><span class="key wide">Shift</span><span class="key">R</span><span class="key">M</span><span class="key">N</span></div>
  <div class="daily-box" style="text-align:left;max-width:min(640px,94vw)" data-i18n-html="menu.help"></div>
  <button id="helpBack" data-i18n="common.back">BACK</button>
</div>

<div id="garageScreen" class="screen" style="display:none">
  <h2 id="gName"></h2>
  <div class="row"><button class="arr" id="gP">◀</button><div id="gStatus" style="min-width:220px;font-weight:800;font-size:18px"></div><button class="arr" id="gN">▶</button></div>
  <div class="stats" id="gStats"></div>
  <div class="upg" id="gUpg"></div>
  <div class="row" id="gPaint"></div>
  <div class="row"><button id="gAct"></button><button id="gBack" class="alt" data-i18n="common.back">BACK</button></div>
</div>

<div id="settings" class="screen" style="display:none">
  <h2 data-i18n="set.title">Settings</h2>
  <div class="setrow"><span data-i18n="set.lang">Language</span><select id="langSel2"></select></div>
  <div class="setrow"><span data-i18n="set.quality">Quality</span><span class="row" style="gap:8px"><button class="arr" id="qP">◀</button><span id="qName" style="min-width:110px;display:inline-block"></span><button class="arr" id="qN">▶</button></span></div>
  <div class="setrow"><span data-i18n="set.music">Music</span><button class="small alt" id="setMusic"></button></div>
  <div class="setrow"><span data-i18n="set.sound">Sound effects</span><button class="small alt" id="setSfx"></button></div>
  <div class="row" style="margin-top:10px"><button id="setReset" class="alt small" data-i18n="set.reset">Reset progress</button><button id="setBack" data-i18n="common.back">BACK</button></div>
</div>

<div id="achvScreen" class="screen" style="display:none">
  <h2><span data-i18n="achv.title">Achievements</span> <small id="achvCount" style="opacity:.7"></small></h2>
  <div class="achvgrid" id="achvGrid"></div>
  <button id="achvBack" data-i18n="common.back">BACK</button>
</div>

<div id="lbScreen" class="screen" style="display:none">
  <h2 data-i18n="daily.title">Daily challenge</h2>
  <div class="daily-box" id="lbInfo"></div>
  <div id="lbTable"></div>
  <div class="row" style="gap:8px"><span data-i18n="lb.name" style="opacity:.75">Your name</span><input class="txt" id="lbName" maxlength="14" autocomplete="off" /><button class="small" id="lbSaveName" data-i18n="lb.save">OK</button></div>
  <div id="lbMsg" style="font-size:13px;opacity:.85;min-height:16px"></div>
  <div class="row"><button id="lbPlay" data-i18n="menu.play">PLAY</button><button id="lbRefresh" class="alt small">↻</button><button id="lbBack" class="alt" data-i18n="common.back">BACK</button></div>
</div>

<div id="end" class="screen" style="display:none">
  <h1 id="endTitle"></h1><p id="endInfo"></p>
  <div class="earn" id="endEarn"></div>
  <div class="earn" id="endExtra"></div>
